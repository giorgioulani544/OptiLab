<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Pivot – maskotka OptiLab">
  <!-- Pivot: złoty „element centralny” tablicy simpleksu. Każda poza to osobna grupa (poza-…); widoczna jest jedna naraz.
       Klasy pomocnicze dla animacji w aplikacji: pv-eyes (mruganie), pv-wand (różdżka), pv-star (gwiazdka na różdżce), pv-fx (efekty). -->
  <defs>
    <g id="pv-body">
      <ellipse cx="110" cy="203" rx="58" ry="8" fill="#1b2a4e" opacity=".12"/>
      <ellipse cx="86" cy="190" rx="16" ry="9" fill="#1b2a4e"/>
      <ellipse cx="134" cy="190" rx="16" ry="9" fill="#1b2a4e"/>
      <rect x="46" y="52" width="128" height="134" rx="34" fill="#ffb703" stroke="#1b2a4e" stroke-width="5"/>
      <path d="M62 78 Q66 62 84 60" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
      <rect x="92" y="148" width="36" height="26" rx="8" fill="#fff4cf" stroke="#1b2a4e" stroke-width="3"/>
      <text x="110" y="168" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="#1b2a4e">1</text>
      <ellipse cx="70" cy="128" rx="9" ry="6" fill="#f28c6b" opacity=".55"/>
      <ellipse cx="150" cy="128" rx="9" ry="6" fill="#f28c6b" opacity=".55"/>
      <path d="M100 52 Q104 34 118 30" fill="none" stroke="#1b2a4e" stroke-width="4" stroke-linecap="round"/>
      <circle cx="120" cy="29" r="6" fill="#e8915c" stroke="#1b2a4e" stroke-width="3"/>
    </g>
    <g id="pv-eyes-open">
      <ellipse cx="88" cy="104" rx="13" ry="15" fill="#fff" stroke="#1b2a4e" stroke-width="3.5"/>
      <ellipse cx="132" cy="104" rx="13" ry="15" fill="#fff" stroke="#1b2a4e" stroke-width="3.5"/>
      <circle cx="91" cy="107" r="6.5" fill="#1b2a4e"/><circle cx="135" cy="107" r="6.5" fill="#1b2a4e"/>
      <circle cx="93" cy="104" r="2" fill="#fff"/><circle cx="137" cy="104" r="2" fill="#fff"/>
    </g>
    <g id="pv-wand">
      <path d="M0 0 L16 -34" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
      <path d="M0 0 L16 -34" stroke="#7a4f9c" stroke-width="3" stroke-linecap="round"/>
      <path class="pv-star" d="M19 -60 l4.6 9.4 10.4 1.5 -7.5 7.3 1.8 10.3 -9.3 -4.9 -9.3 4.9 1.8 -10.3 -7.5 -7.3 10.4 -1.5z" fill="#fff1a8" stroke="#1b2a4e" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <g id="poza-explain">
    <use href="#pv-body"/>
    <g class="pv-eyes"><use href="#pv-eyes-open"/></g>
    <path d="M78 84 Q88 78 98 83 M122 83 Q132 78 142 84" fill="none" stroke="#1b2a4e" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M96 132 Q110 144 124 132" fill="none" stroke="#1b2a4e" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 132 Q30 138 26 156" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <path d="M172 126 Q192 112 196 92" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <g fill="#1b2a4e"><circle cx="197" cy="88" r="7"/><circle cx="26" cy="160" r="7"/></g>
  </g>

  <g id="poza-point">
    <use href="#pv-body"/>
    <g class="pv-eyes"><use href="#pv-eyes-open"/></g>
    <path d="M78 82 Q88 76 98 81 M122 79 Q132 74 142 80" fill="none" stroke="#1b2a4e" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M94 130 Q110 146 128 128" fill="none" stroke="#1b2a4e" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 132 Q30 138 26 156" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="26" cy="160" r="7" fill="#1b2a4e"/>
    <path d="M172 124 Q186 116 184 102" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <g class="pv-wand" transform="translate(184 100)"><use href="#pv-wand"/></g>
    <circle cx="184" cy="101" r="7.5" fill="#1b2a4e"/>
  </g>

  <g id="poza-think">
    <use href="#pv-body"/>
    <g class="pv-eyes">
      <ellipse cx="88" cy="104" rx="13" ry="15" fill="#fff" stroke="#1b2a4e" stroke-width="3.5"/>
      <ellipse cx="132" cy="104" rx="13" ry="15" fill="#fff" stroke="#1b2a4e" stroke-width="3.5"/>
      <circle cx="84" cy="98" r="6.5" fill="#1b2a4e"/><circle cx="128" cy="98" r="6.5" fill="#1b2a4e"/>
    </g>
    <path d="M78 80 Q88 76 98 82 M122 86 Q132 80 142 82" fill="none" stroke="#1b2a4e" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M100 136 Q112 132 122 136" fill="none" stroke="#1b2a4e" stroke-width="4" stroke-linecap="round"/>
    <path d="M172 140 Q178 156 150 150" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="146" cy="148" r="7" fill="#1b2a4e"/>
    <path d="M48 132 Q30 138 26 156" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="26" cy="160" r="7" fill="#1b2a4e"/>
    <g class="pv-fx" fill="#fff" stroke="#1b2a4e" stroke-width="2.5"><circle cx="40" cy="44" r="5"/><circle cx="26" cy="28" r="7"/><circle cx="12" cy="10" r="4"/></g>
  </g>

  <g id="poza-surprise">
    <use href="#pv-body"/>
    <g class="pv-eyes">
      <circle cx="88" cy="104" r="16" fill="#fff" stroke="#1b2a4e" stroke-width="3.5"/>
      <circle cx="132" cy="104" r="16" fill="#fff" stroke="#1b2a4e" stroke-width="3.5"/>
      <circle cx="88" cy="104" r="5" fill="#1b2a4e"/><circle cx="132" cy="104" r="5" fill="#1b2a4e"/>
    </g>
    <path d="M76 76 Q88 66 100 74 M120 74 Q132 66 144 76" fill="none" stroke="#1b2a4e" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="110" cy="138" rx="9" ry="11" fill="#7a2e1f" stroke="#1b2a4e" stroke-width="3.5"/>
    <path d="M48 120 Q28 104 26 82" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <path d="M172 120 Q192 104 194 82" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <g fill="#1b2a4e"><circle cx="26" cy="78" r="7"/><circle cx="194" cy="78" r="7"/></g>
    <g class="pv-fx" stroke="#e8915c" stroke-width="4" stroke-linecap="round"><path d="M160 30 l8 -12 M176 42 l13 -6 M146 24 l1 -14"/></g>
  </g>

  <g id="poza-happy">
    <use href="#pv-body"/>
    <g class="pv-eyes" fill="none" stroke="#1b2a4e" stroke-width="5" stroke-linecap="round"><path d="M76 108 Q88 92 100 108"/><path d="M120 108 Q132 92 144 108"/></g>
    <path d="M90 126 Q110 156 130 126 Z" fill="#7a2e1f" stroke="#1b2a4e" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 140 Q110 134 120 140" fill="none" stroke="#f28c6b" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 116 Q26 100 28 72" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <path d="M172 116 Q194 100 192 72" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <g fill="#1b2a4e"><circle cx="28" cy="68" r="7"/><circle cx="192" cy="68" r="7"/></g>
    <g class="pv-fx" fill="#ffd166" stroke="#1b2a4e" stroke-width="2"><path d="M40 30 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/><path d="M180 24 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/><path d="M200 120 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/></g>
  </g>

  <g id="poza-oops">
    <use href="#pv-body"/>
    <g class="pv-eyes">
      <ellipse cx="88" cy="106" rx="12" ry="13" fill="#fff" stroke="#1b2a4e" stroke-width="3.5"/>
      <ellipse cx="132" cy="106" rx="12" ry="13" fill="#fff" stroke="#1b2a4e" stroke-width="3.5"/>
      <circle cx="88" cy="110" r="5.5" fill="#1b2a4e"/><circle cx="132" cy="110" r="5.5" fill="#1b2a4e"/>
    </g>
    <path d="M76 84 Q86 90 98 86 M122 86 Q134 90 144 84" fill="none" stroke="#1b2a4e" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M94 140 Q100 132 106 140 Q112 148 118 140 Q122 134 126 140" fill="none" stroke="#1b2a4e" stroke-width="4" stroke-linecap="round"/>
    <path d="M172 112 Q186 86 160 60" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="157" cy="58" r="7" fill="#1b2a4e"/>
    <path d="M48 132 Q30 138 26 156" fill="none" stroke="#1b2a4e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="26" cy="160" r="7" fill="#1b2a4e"/>
    <path class="pv-fx" d="M58 62 Q50 74 56 80 Q64 82 64 74 Q64 70 58 62 Z" fill="#9fd3ff" stroke="#1b2a4e" stroke-width="2.5"/>
  </g>
</svg>
