<style>
/* ===== Motyw: papier milimetrowy + granat tuszu ===== */
:root{--ink:#1b2a4e;--paper:#f4f0e6;--card:#fdfcf8;--line:#c9cbd8;--accent:#1b2a4e;--link:#1a6fd6;--pivot:#ffb703;--hl:#fff1c2;--err:#c0261b;--ok:#2e7d32}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--paper);
 background-image:linear-gradient(rgba(27,42,78,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(27,42,78,.05) 1px,transparent 1px);background-size:24px 24px;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,h4{margin:.2em 0}h2{font-size:1.1rem}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1100px;margin:0 auto;padding:14px 16px 6px}
header{align-items:center}header h1{font-size:1.5rem;margin:0}#tabname{flex:1}
#tabname{color:#6b7390}
button,select,input{font:inherit;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff;color:var(--ink)}
button{cursor:pointer;background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
input{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
input.num{width:64px;text-align:right}
:focus-visible{outline:3px solid var(--pivot);outline-offset:1px}
.app{max-width:1100px;margin:0 auto;padding:8px 12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.crow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.crow label{white-space:nowrap}
.hint{font-size:.85rem;color:#5b6b82}
/* Zakładki: przewijany poziomo pasek (działa też na telefonie) */
/* Dolny pasek zakładek (jak w aplikacji mobilnej) */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--card);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 auto;min-width:92px;padding:0 14px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;border:0;border-radius:0;background:transparent;color:#6b7390;font-size:.8rem}
nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected=true]{color:var(--ink)}
nav button.soon{opacity:.6}
.credit{text-align:center;font-size:.7rem;color:rgba(27,42,78,.35);margin:18px 0 0}
/* Błąd przy polu: czerwona ramka + komunikat w tym samym wierszu */
.fmsg{flex-basis:100%;color:var(--err);font-weight:600;font-size:.9rem}
.note{color:#6b7390}
/* Tabele przewijane palcem */
.tw{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{border:1px solid var(--line);padding:6px 10px;text-align:right;white-space:nowrap;min-width:48px}
th{background:#eaf0f5}
td.pr,td.pcol{background:var(--hl)}
td.pivot{background:var(--pivot);font-weight:700}
.step{border-left:5px solid var(--accent);padding:4px 12px;margin:14px 0;background:#fcfdfe;border-radius:0 8px 8px 0}
.step p{margin:.3em 0}
/* Błędy */
.bad{border-color:var(--err)!important;background:#fdecea!important}
.msg{background:#fdecea;border:1.5px solid var(--err);color:#8e1b1b;padding:10px 12px;border-radius:8px;margin:8px 0}
.sum{background:#e7f5ef;border:1.5px solid var(--ok);padding:10px 12px;border-radius:8px;margin:8px 0}
/* Drzewo B&B */
.tree ul{list-style:none;margin:4px 0 4px 6px;padding-left:14px;border-left:2px solid var(--line)}
.tree li{margin:6px 0;padding:6px 8px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.tree li.int{border-color:var(--ok);background:#e7f5ef}
.tree li.cut{border-color:#e0a0a0;background:#fbf1f1}
#plot{width:100%;height:min(70vh,520px)}
#print-area{display:none}
/* ===== Raport: tylko czysty dokument ===== */
@media print{
 body{background:#fff}
 header,.app,nav,.credit{display:none!important}
 #print-area{display:block;padding:0 8px}
 .step{break-inside:avoid}
 .tw{overflow:visible}
}
</style>
</head>

<script>
/* =====================================================================
   1. NARZĘDZIA
   ===================================================================== */
const $ = s => document.querySelector(s);
const BIGM = 1e6;                       // stała „dużego M" dla zmiennych sztucznych
// Formatowanie liczb: max 4 miejsca po przecinku, bez krzaków przy dużych/małych wartościach
const fmt = v => {
  if (Math.abs(v) < 1e-9) return '0';
  if (Math.abs(v) >= 1e9) return v.toExponential(2).replace('.', ',');
  return String(Math.round(v * 1e4) / 1e4).replace('.', ',');
};
const last = {};                        // ostatnie wyniki do raportu
let lastModel = null;

/* =====================================================================

function initModule(k) {

/* Odczyt i walidacja. Błąd => czerwone pola + komunikat edukacyjny, zwraca null */
const clearErr = () => {

  document.querySelectorAll('.fmsg').forEach(x => x.remove());
};
let K = 'graph';                             // moduł, którego dotyczy bieżący błąd
/* Błąd = czerwone pole + komunikat w wierszu tego pola. Zwraca null. */
function fail(out, msg, ids = [], keep = false) {

  const row = ids.length ? $('#' + K + '-' + ids[0])?.closest('.crow') : null;
  if (row) row.insertAdjacentHTML('beforeend', `<div class="fmsg">Błąd: ${msg}</div>`);

function readModel(k) {
  K = k; const out = '#out-' + k, p = k + '-'; clearErr(); sync(k);
  const md = models[k], bad = [];
  const num = id => {
    const s = $('#' + p + id).value.trim().replace(',', '.'), v = Number(s);
    if (s === '' || s === '-' || s === '.' || !isFinite(v) || Math.abs(v) > 1e9) { bad.push(id); return NaN; }
    return v;
  };
  const n = md.n, m = md.rows.length;

  const b = md.rows.map((_, i) => num('b' + i)), rel = md.rows.map(r => r.rel);

  if (c.every(v => v === 0)) return fail(out, 'funkcja celu ma same zera – nie ma czego optymalizować.', c.map((_, j) => 'c' + j));

    if (!ok) return fail(out, `ograniczenie ${i+1} ma same zera po lewej stronie, więc 0 ${rel[i]} ${fmt(b[i])} nigdy nie jest prawdą.`, [`a${i}_0`, 'b' + i]);

// Opis ograniczenia/celu słowami
const term = (a, j, first, pf = 'x') => (a < 0 ? '−' : first ? '' : '+') + (first ? '' : ' ') + (Math.abs(a) === 1 ? '' : fmt(Math.abs(a))) + pf + (j + 1);

/* =====================================================================
   3. SOLVER SIMPLEKS (tablicowy, metoda dużego M) Z ZAPISEM KROKÓW
   Obsługuje ograniczenia ≤, ≥, =. Minimalizację zamienia na maksymalizację −Z.

function solveLP(c, A0, rel0, b0, maxi, rec, vn) {
  const n = c.length, m = A0.length;

  // Prawe strony muszą być ≥ 0: mnożymy wiersz przez −1 i odwracamy znak

    else {

      extra.push({i, col: N, v: 1, art: true}); names.push('a' + (i+1)); basis[i] = N++; hasArt = true;

  extra.forEach(e => T[e.i][e.col] = e.v);

    for (let j = 0; j <= N; j++) T[m][j] -= BIGM * T[i][j];

  snap(`Tablica początkowa. Zamieniamy nierówności na równania: dodajemy zmienne zapasu (s), nadwyżki (e) i sztuczne (a). Zmienne bazowe: ${basis.map(k => names[k]).join(', ')}.` +
       (hasArt ? ` Zmienne sztuczne karzemy dużą stałą M = 10⁶ (metoda dużego M).` : '') +

    if (pc < 0) break;                                                  // optimum
    let pr = -1, best = Infinity; const ratios = [];
    for (let i = 0; i < m; i++) if (T[i][pc] > 1e-9) {
      const q = T[i][N] / T[i][pc]; ratios.push(`${names[basis[i]]}: ${fmt(T[i][N])}/${fmt(T[i][pc])} = ${fmt(q)}`);
      if (q < best - 1e-12) { best = q; pr = i; }
    }
    if (pr < 0) { snap(`Kolumna ${names[pc]} nie ma dodatnich elementów, więc zmienną ${names[pc]} można zwiększać w nieskończoność bez łamania ograniczeń. Problem jest nieograniczony.`, -1, pc); return {status: 'unbounded', pc}; }
    const p = T[pr][pc];
    snap(`Iteracja ${it}. Kolumna wejściowa: ${names[pc]} – najbardziej ujemna wartość w wierszu Z (${fmt(T[m][pc])}), więc wprowadzenie tej zmiennej najbardziej poprawia funkcję celu. ` +
         `Test ilorazów (prawa strona ÷ element kolumny): ${ratios.join('; ')}. Najmniejszy iloraz (${fmt(best)}) ma wiersz zmiennej ${names[basis[pr]]} – ona opuszcza bazę. ` +
         `Element centralny = ${fmt(p)}. Dzielimy wiersz przez ${fmt(p)}, potem zerujemy resztę kolumny ${names[pc]}.`, pr, pc);

    snap('W bazie została zmienna sztuczna o dodatniej wartości – ograniczenia wzajemnie się wykluczają. Brak rozwiązania dopuszczalnego.');

}
/* Typy zmiennych: c = ≥0, i = całkowita, b = binarna, u = dowolna (x = x⁺ − x⁻), n = ≤0 (tylko w dualnym) */
const TL = {c: '≥ 0', i: 'całkowita ≥ 0', b: 'binarna', u: 'dowolna', n: '≤ 0'};

/* Raport końcowy jak w QSB: koszty zredukowane, luzy, ceny dualne i zakresy analizy wrażliwości.
   Zakresy liczymy z końcowej tablicy (baza ma pozostać optymalna). */
function qsbReport(M, r, rec) {
  const s = rec[rec.length - 1], T = s.T, m = M.A.length, n = M.n, N = T[0].length - 1; let alt = false;
  const rg = (lo, hi) => `${isFinite(lo) ? fmt(lo) : '−∞'} … ${isFinite(hi) ? fmt(hi) : '+∞'}`;
  let h = '<h3>Raport końcowy i analiza wrażliwości</h3><div class="tw"><table><tr><th>Zmienna</th><th>Wartość</th><th>Współcz. celu</th><th>Wkład w Z</th><th>Koszt zredukowany</th><th>Zakres współcz. celu</th></tr>';
  for (let j = 0; j < n; j++) {

    let lo = -Infinity, hi = row < 0 ? rc : Infinity;                    // zmiana współczynnika w postaci „max"

  h += '</table></div><div class="tw"><table><tr><th>Ograniczenie</th><th>Lewa str.</th><th>Znak</th><th>Prawa str.</th><th>Luz / nadwyżka</th><th>Cena dualna</th><th>Zakres prawej strony</th></tr>';
  M.A.forEach((a, i) => {
    const lhs = a.reduce((t, v, j) => t + v * r.x[j], 0), b2 = M.b.slice(); b2[i] += 1e-4;
    const q = solveM({...M, b: b2}), sp = q.status === 'optimal' ? (q.z - r.z) / 1e-4 : NaN;
    let lo = -Infinity, hi = Infinity;                                   // kolumna B⁻¹ dla i-tego ograniczenia
    for (let k = 0; k < m; k++) { const u = T[k][s.b0[i]], be = T[k][N];
      if (u > 1e-9) lo = Math.max(lo, -be / u); else if (u < -1e-9) hi = Math.min(hi, be / -u); }
    if (s.fl[i]) [lo, hi] = [-hi, -lo];
    h += `<tr><th>Ogr. ${i+1}</th><td>${fmt(lhs)}</td><td>${sign(M.rel[i])}</td><td>${fmt(M.b[i])}</td><td>${fmt(Math.abs(M.b[i] - lhs))}</td><td>${isNaN(sp) ? '–' : fmt(sp)}</td><td>${rg(M.b[i] + lo, M.b[i] + hi)}</td></tr>`;
  });
  h += '</table></div><p class="hint">Cena dualna: o ile zmieni się Z, gdy prawa strona wzrośnie o 1. Koszt zredukowany: o ile pogorszy się Z po wymuszeniu 1 jednostki zmiennej spoza bazy. Zakresy: w tych granicach obecna baza pozostaje optymalna.</p>';
  return h + (alt ? '<p class="note">Uwaga: zmienna spoza bazy ma koszt zredukowany 0 – mogą istnieć alternatywne rozwiązania optymalne.</p>' : '');
}
/* Zadanie dualne: zapis + rozwiązanie (kontrola: W_opt = Z_opt) */
$('#btn-dual').onclick = () => {
  const M = readModel('simplex'); if (!M) return;
  const D = dualOf(M), r = solveM(D);
  let h = '<h3>Zadanie dualne</h3>' + dualHTML(D);
  h += r.status === 'optimal' ? `<div class="sum"><b>Wynik dualny:</b> ${r.x.map((v, i) => `y${i+1} = ${fmt(v)}`).join(', ')}; W<sub>opt</sub> = <b>${fmt(r.z)}</b>. Z twierdzenia o dualności W<sub>opt</sub> = Z<sub>opt</sub> zadania pierwotnego.</div>`
    : `<p class="note">Zadanie dualne ${r.status === 'unbounded' ? 'jest nieograniczone, więc pierwotne nie ma rozwiązań dopuszczalnych' : 'jest sprzeczne, więc pierwotne jest nieograniczone lub sprzeczne'}.</p>`;
  $('#out-dual').innerHTML = h; last.dual = h;
};
$('#btn-simplex').onclick = () => {
  const out = '#out-simplex', M = readModel('simplex'); if (!M) return;
  const rec = [], r = solveM(M, [], rec);
  let h = infoHTML(M);
  rec.forEach((s, k) => h += `<div class="step"><h4>Krok ${k + 1}</h4><p>${s.text}</p>${tableHTML(s)}</div>`);
  if (r.status !== 'optimal') { $(out).innerHTML = h; last.simplex = h; failLP(out, r, M, true); return; }
  h += `<div class="sum"><b>Wynik:</b> ${r.x.map((v, j) => `x${j+1} = ${fmt(v)}`).join(', ')}; Z<sub>opt</sub> = <b>${fmt(r.z)}</b></div>`;
  h += qsbReport(M, r, rec);
  $(out).innerHTML = h; last.simplex = h;
};

/* =====================================================================
   5. ZAKŁADKA: METODA GRAFICZNA (2 zmienne)
   Wierzchołki = przecięcia par prostych (w tym osi), które spełniają wszystkie ograniczenia.
   ===================================================================== */
$('#btn-graph').onclick = () => {
  const out = '#out-graph', M = readModel('graph'); if (!M) return;
  if (M.n !== 2) return fail(out, 'metoda graficzna działa dla dokładnie 2 zmiennych. Ustaw liczbę zmiennych na 2 albo użyj zakładki Simpleks.', ['nvars']);
  const L = M.A.map((a, i) => ({a: a[0], b: a[1], r: M.b[i], rel: M.rel[i], name: 'Ogr. ' + (i + 1)}));
  const all = [...L, {a: 1, b: 0, r: 0, rel: '>='}, {a: 0, b: 1, r: 0, rel: '>='}];
  const ok = (x, y) => all.every(l => { const v = l.a * x + l.b * y;
    return l.rel === '<=' ? v <= l.r + 1e-7 : l.rel === '>=' ? v >= l.r - 1e-7 : Math.abs(v - l.r) < 1e-7; });
  let P = [];
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const p = all[i], q = all[j], d = p.a * q.b - q.a * p.b; if (Math.abs(d) < 1e-12) continue;
    const x = (p.r * q.b - q.r * p.b) / d, y = (p.a * q.r - q.a * p.r) / d;
    if (ok(x, y) && !P.some(u => Math.abs(u[0] - x) < 1e-6 && Math.abs(u[1] - y) < 1e-6)) P.push([x, y]);
  }
  if (!P.length) return fail(out, 'Brak obszaru dopuszczalnego – żaden punkt nie spełnia wszystkich ograniczeń naraz. Sprawdź znaki nierówności i prawe strony.', M.b.map((_, i) => 'b' + i));
  const cx = P.reduce((s, p) => s + p[0], 0) / P.length, cy = P.reduce((s, p) => s + p[1], 0) / P.length;
  P.sort((p, q) => Math.atan2(p[1] - cy, p[0] - cx) - Math.atan2(q[1] - cy, q[0] - cx));
  const Z = P.map(p => M.c[0] * p[0] + M.c[1] * p[1]);
  const zopt = M.maxi ? Math.max(...Z) : Math.min(...Z);
  const Lmax = Math.max(1, ...P.flat()) * 1.4;
  const lineTr = (l, color, dash, name) => {                              // prosta + etykieta z równaniem
    const pts = []; let lx = [], ly = [];
    if (Math.abs(l.b) > 1e-12) for (let k = 0; k <= 40; k++) { const x = Lmax * k / 40, y = (l.r - l.a * x) / l.b; lx.push(x); ly.push(y); if (y >= 0 && y <= Lmax) pts.push([x, y]); }
    else { lx = [l.r / l.a, l.r / l.a]; ly = [0, Lmax]; pts.push([lx[0], Lmax * .5]); }
    const lab = pts[Math.floor(pts.length / 2)] || [null, null];
    return [{x: lx, y: ly, mode: 'lines', name, line: {color, dash, width: 2}, hoverinfo: 'name'},
            {x: [lab[0]], y: [lab[1]], mode: 'text', text: [`${name}: ${expr([l.a, l.b])} ${sign(l.rel)} ${fmt(l.r)}`], textposition: 'top right', showlegend: false, hoverinfo: 'skip', textfont: {color}}];
  };
  const pal = ['#d62828', '#1d4ed8', '#7b2cbf', '#e76f51', '#0b7a75', '#6b705c', '#bc6c25', '#264653'];
  let tr = [{x: [...P.map(p => p[0]), P[0][0]], y: [...P.map(p => p[1]), P[0][1]], fill: 'toself', fillcolor: 'rgba(26,111,214,.22)', line: {color: 'rgba(26,111,214,.9)', width: 1}, name: 'Obszar dopuszczalny', hoverinfo: 'skip'}];
  L.forEach((l, i) => tr.push(...lineTr(l, pal[i % 8], 'solid', l.name)));
  if (Math.abs(M.c[0]) + Math.abs(M.c[1]) > 0) tr.push(lineTr({a: M.c[0], b: M.c[1], r: zopt}, '#111', 'dash', 'Z = ' + fmt(zopt))[0]);
  tr.push({x: P.map(p => p[0]), y: P.map(p => p[1]), customdata: Z, mode: 'markers', name: 'Wierzchołki',
    marker: {size: Z.map(z => Math.abs(z - zopt) < 1e-7 ? 16 : 10), color: Z.map(z => Math.abs(z - zopt) < 1e-7 ? '#ffb703' : '#1b2a4e'), line: {color: '#fff', width: 2}},
    hovertemplate: '(%{x:.3f}; %{y:.3f})<br>Z = %{customdata:.3f}<extra>Wierzchołek</extra>'});
  Plotly.newPlot('plot', tr, {xaxis: {title: 'x₁', range: [0, Lmax]}, yaxis: {title: 'x₂', range: [0, Lmax]}, legend: {orientation: 'h', y: -0.25}, margin: {l: 45, r: 10, t: 10, b: 40}}, {responsive: true, displaylogo: false});
  const chk = solveM(M);
  let h = infoHTML(M) + '<div class="tw"><table><tr><th>Wierzchołek</th><th>x₁</th><th>x₂</th><th>Z</th></tr>' +
    P.map((p, i) => `<tr><th>W${i+1}</th><td>${fmt(p[0])}</td><td>${fmt(p[1])}</td><td class="${Math.abs(Z[i] - zopt) < 1e-7 ? 'pivot' : ''}">${fmt(Z[i])}</td></tr>`).join('') + '</table></div>';
  if (chk.status === 'unbounded') { h += '<p class="note">Obszar jest nieograniczony – wierzchołki poniżej nie są optimum.</p>'; }
  else h += `<div class="sum"><b>Wynik:</b> optimum w wierzchołku (${fmt(P[Z.findIndex(z => Math.abs(z - zopt) < 1e-7)][0])}; ${fmt(P[Z.findIndex(z => Math.abs(z - zopt) < 1e-7)][1])}), Z<sub>opt</sub> = <b>${fmt(zopt)}</b>. Wierzchołek optymalny jest wyróżniony na złoto.</div>`;
  $(out).innerHTML = h; last.graph = h;
  if (chk.status === 'unbounded') failLP(out, chk, M, true);
};

/* =====================================================================
   6. ZAKŁADKA: PROGRAMOWANIE CAŁKOWITOLICZBOWE – BRANCH & BOUND
   Węzeł = relaksacja LP z dodatkowymi granicami zmiennych. Wybieramy pierwszą
   ułamkową zmienną x_j i dzielimy na x_j ≤ ⌊v⌋ oraz x_j ≥ ⌊v⌋+1.
   ===================================================================== */
$('#btn-ilp').onclick = () => {
  const out = '#out-ilp', M = readModel('ilp'); if (!M) return;
  const sg = M.maxi ? 1 : -1, n = M.n; let bestW = -Infinity, best = null, id = 0, trunc = false;
  const isInt = M.t.map(t => t === 'i' || t === 'b');
  function visit(lb, ub, label) {
    const node = {id: ++id, label, kids: []};
    if (id > 200) { trunc = true; node.res = 'Przerwano: limit 200 węzłów.'; return node; }
    const ex = [];
    for (let j = 0; j < n; j++) {
      if (lb[j] > -Infinity && !(lb[j] === 0 && M.t[j] !== 'u')) ex.push({j, rel: '>=', b: lb[j]});
      if (ub[j] < Infinity) ex.push({j, rel: '<=', b: ub[j]});
    }
    const r = solveM(M, ex);
    if (r.status === 'unbounded' && id === 1) { node.res = 'Relaksacja LP jest nieograniczona.'; node.unb = true; return node; }
    if (r.status !== 'optimal') { node.cls = 'cut'; node.res = 'Brak rozwiązań dopuszczalnych – gałąź odcięta.'; return node; }
    node.info = `x = (${r.x.map(fmt).join('; ')}), Z = ${fmt(r.z)}`;
    if (sg * r.z <= bestW + 1e-9) { node.cls = 'cut'; node.res = `Odcięty: nawet bez wymogu całkowitości Z = ${fmt(r.z)} nie bije najlepszego całkowitego (${fmt(sg * bestW)}).`; return node; }
    const j = r.x.findIndex((v, k) => isInt[k] && Math.abs(v - Math.round(v)) > 1e-6);
    if (j < 0) { bestW = sg * r.z; best = r.x.map((v, k) => isInt[k] ? Math.round(v) : v); node.cls = 'int'; node.res = `Rozwiązanie całkowite – nowy rekord Z = ${fmt(r.z)}.`; return node; }
    const f = Math.floor(r.x[j] + 1e-9);
    node.res = `x${j+1} = ${fmt(r.x[j])} jest ułamkiem. Odcinamy pas między ${f} a ${f + 1} i dzielimy na x${j+1} ≤ ${f} oraz x${j+1} ≥ ${f + 1}.`;
    const u2 = ub.slice(); u2[j] = f; node.kids.push(visit(lb, u2, `x${j+1} ≤ ${f}`));
    const l2 = lb.slice(); l2[j] = f + 1; node.kids.push(visit(l2, ub, `x${j+1} ≥ ${f + 1}`));
    return node;
  }
  const root = visit(M.t.map(t => t === 'u' ? -Infinity : 0), M.t.map(t => t === 'b' ? 1 : Infinity), '');
  if (root.unb) return failLP(out, {status: 'unbounded'}, M);
  const li = nd => `<li class="${nd.cls || ''}"><b>Węzeł ${nd.id}</b> ${nd.label ? '[' + nd.label + ']' : '(relaksacja LP problemu)'}${nd.info ? ': ' + nd.info : ''}<br>${nd.res}` +
    (nd.kids.length ? '<ul>' + nd.kids.map(li).join('') + '</ul>' : '') + '</li>';
  let h = infoHTML(M) + '<p>Zmienne całkowite i binarne dzielimy metodą Branch &amp; Bound; każdy węzeł to LP rozwiązane simpleksem.</p><ul>' + li(root) + '</ul>';
  if (best === null) { $(out).innerHTML = h; last.ilp = h; fail(out, 'Brak rozwiązania całkowitego spełniającego wszystkie ograniczenia.', M.b.map((_, i) => 'b' + i), true); return; }
  h += `<div class="sum"><b>Wynik:</b> ${best.map((v, j) => `x${j+1} = ${fmt(v)}`).join(', ')}; Z<sub>opt</sub> = <b>${fmt(sg * bestW)}</b>${trunc ? ' (przerwano po 200 węzłach – wynik może nie być optymalny)' : ''}</div>`;
  $(out).innerHTML = h; last.ilp = h;
};

/* =====================================================================
   7. ZAKŁADKI I EKSPORT RAPORTU (druk do PDF przez @media print)
   ===================================================================== */
const TITLES = {graph: 'Metoda graficzna', simplex: 'Simpleks', ilp: 'Całkowitoliczbowe'};
/* Moduły zapowiedziane (lista z oryginalnego QSB) – na razie bez funkcji, tylko komunikat */
const SOON = [['net', 'Modele sieciowe'], ['pert', 'PERT / CPM'], ['goal', 'Programowanie celowe'], ['dp', 'Programowanie dynamiczne'],
  ['qp', 'Programowanie kwadratowe'], ['nlp', 'Programowanie nieliniowe'], ['queue', 'Kolejki'], ['qsim', 'Symulacja kolejek'],
  ['inv', 'Zapasy'], ['fc', 'Prognozowanie'], ['dec', 'Analiza decyzji'], ['mk', 'Procesy Markowa'], ['agg', 'Planowanie zagregowane'],
  ['mrp', 'MRP'], ['job', 'Harmonogramowanie zadań'], ['loc', 'Lokalizacja i układ'], ['qc', 'Karty kontrolne'], ['acc', 'Odbiór statystyczny']];
const SOON_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/><path d="M9 12h.01M12 12h.01M15 12h.01"/></svg>';
SOON.forEach(([id, name]) => $('nav').insertAdjacentHTML('beforeend', `<button role="tab" class="soon" data-tab="${id}" aria-selected="false">${SOON_ICON}${name}</button>`));
function goTab(t) {
  const soon = SOON.find(x => x[0] === t), title = soon ? soon[1] : TITLES[t];
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x.dataset.tab === t));
  [...Object.keys(TITLES), 'soon'].forEach(k => $('#tab-' + k).hidden = k !== (soon ? 'soon' : t));
  $('#soon-title').textContent = title; $('#tabname').textContent = title; window.scrollTo(0, 0);
  $('nav button[aria-selected=true]').scrollIntoView({inline: 'center', block: 'nearest'});
  if (t === 'graph') Plotly.Plots.resize('plot');
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => goTab(b.dataset.tab));
$('#logo').src = $('link[rel=icon]').href;     // logo w nagłówku = ta sama ikona
$('#btn-export').onclick = async () => {
  if (!lastModel || !(last.graph || last.simplex || last.ilp)) {
    const eb = $('#btn-export'); eb.classList.add('bad'); eb.textContent = 'Najpierw rozwiąż problem';
    setTimeout(() => { eb.classList.remove('bad'); eb.textContent = 'Eksportuj raport'; }, 2500); return; }
  let h = `<h1>Raport z obliczeń</h1><p>${new Date().toLocaleDateString('pl-PL')}</p><h2>Dane wejściowe</h2>${infoHTML(lastModel)}`;
  if (last.graph) {
    const img = await Plotly.toImage('plot', {format: 'png', width: 900, height: 560});
    h += `<h2>Metoda graficzna</h2><img src="${img}" style="max-width:100%">${last.graph}`;
  }
  if (last.simplex) h += `<h2>Metoda simpleks</h2>${last.simplex}`;
  if (last.dual) h += `<h2>Zadanie dualne</h2>${last.dual}`;
  if (last.ilp) h += `<h2>Programowanie całkowitoliczbowe</h2><div class="tree">${last.ilp}</div>`;
  $('#print-area').innerHTML = h; window.print();
};

MODS.forEach(initModule);
</script>
